services:
  postgres:
    image: postgres:16-alpine
    container_name: dutyledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dutyledger_db}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dutyledger_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: dutyledger-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4500}:4500"
    environment:
      PORT: 4500
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dutyledger_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dutyledger_jwt_super_secret_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3100}
      SMTP_EMAIL: ${SMTP_EMAIL:-hr@lucentpolysystems.com}
      SMTP_PASS: ${SMTP_PASS:-}
      HR_EMAIL: ${HR_EMAIL:-hr@lucentpolysystems.com}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: dutyledger-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
