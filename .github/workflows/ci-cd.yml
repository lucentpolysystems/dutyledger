name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend - Prisma Validation & PostgreSQL Migration Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dutyledger_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dutyledger_test_db?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package.json

      - name: Install backend dependencies
        working-directory: ./Backend
        run: npm install

      - name: Validate Prisma Schema
        working-directory: ./Backend
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: ./Backend
        run: npx prisma generate

      - name: Verify PostgreSQL Schema Push
        working-directory: ./Backend
        run: npx prisma db push --skip-generate

  frontend:
    name: Frontend - Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package.json

      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Build Frontend SPA
        working-directory: ./Frontend
        run: npm run build

  docker-build:
    name: Docker - Build Images Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: false
          tags: dutyledger-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: false
          tags: dutyledger-frontend:latest
